name: Import UPSC Prelims PDFs

on:
  push:
    paths:
      - '.github/workflows/import-upsc-prelims-pdfs.yml'

permissions:
  contents: write

jobs:
  import-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Download UPSC GS Paper I PDFs
        shell: python
        run: |
          import os
          import re
          import sys
          import time
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          OUT = 'public/pyq/upsc/prelims'
          os.makedirs(OUT, exist_ok=True)

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (compatible; OneShotGS-PYQ-Importer/1.0; +https://oneshotgs.com)'
          }
          session = requests.Session()
          session.headers.update(HEADERS)

          INDEX_URLS = [
              'https://www.upsc.gov.in/examinations/previous-question-papers',
              'https://www.upsc.gov.in/examinations/previous-question-papers/archives',
          ]

          def get(url):
              r = session.get(url, timeout=90)
              r.raise_for_status()
              return r

          def clean(s):
              return re.sub(r'\s+', ' ', s or '').strip()

          def is_gs1(label):
              t = clean(label).lower().replace('–', '-').replace('—', '-')
              if 'general studies' not in t:
                  return False
              if 'engineering aptitude' in t:
                  return False
              if re.search(r'paper\s*-?\s*ii\b', t):
                  return False
              return bool(re.search(r'paper\s*-?\s*i\b', t) or re.search(r'paper\s*1\b', t))

          def find_from_index(year):
              target = f'Civil Services (Preliminary) Examination, {year}'.lower()
              for index_url in INDEX_URLS:
                  html = get(index_url).text
                  soup = BeautifulSoup(html, 'html.parser')
                  text = soup.get_text(' ', strip=True).lower()
                  if target not in text:
                      continue

                  # Locate an element containing the examination title and inspect
                  # the following document links until the next examination block.
                  title_node = soup.find(string=lambda x: x and target in clean(x).lower())
                  if title_node:
                      anchor = title_node.parent
                      seen = 0
                      for el in anchor.find_all_next(['a', 'h2', 'h3', 'h4', 'div', 'strong']):
                          if el is anchor:
                              continue
                          etext = clean(el.get_text(' ', strip=True))
                          low = etext.lower()
                          if year != 2026 and seen > 0 and 'examination,' in low and str(year) not in low and el.name in {'h2','h3','h4'}:
                              break
                          if el.name == 'a':
                              seen += 1
                              href = el.get('href', '')
                              if is_gs1(etext) and href:
                                  return urljoin(index_url, href)
                          if seen > 80:
                              break

                  # Fallback: take a bounded HTML window after the exact exam title.
                  lower = html.lower()
                  pos = lower.find(target)
                  if pos >= 0:
                      window = html[pos:pos + 180000]
                      wsoup = BeautifulSoup(window, 'html.parser')
                      for a in wsoup.find_all('a', href=True):
                          if is_gs1(a.get_text(' ', strip=True)):
                              return urljoin(index_url, a['href'])
              return None

          def find_2026():
              page = 'https://www.upsc.gov.in/examinations/Civil%20Services%20%28Preliminary%29%20Examination%2C%202026'
              soup = BeautifulSoup(get(page).text, 'html.parser')
              for a in soup.find_all('a', href=True):
                  if is_gs1(a.get_text(' ', strip=True)):
                      return urljoin(page, a['href'])
              return None

          failures = []
          for year in range(2014, 2027):
              dest = os.path.join(OUT, f'{year}.pdf')
              if os.path.exists(dest) and os.path.getsize(dest) > 10000:
                  print(f'{year}: already present')
                  continue

              url = find_2026() if year == 2026 else find_from_index(year)
              if not url:
                  failures.append(f'{year}: GS Paper I link not found')
                  continue

              print(f'{year}: {url}')
              try:
                  r = get(url)
                  content = r.content
                  ctype = r.headers.get('content-type', '')
                  if not content.startswith(b'%PDF'):
                      raise RuntimeError(f'not a PDF (content-type={ctype}, first bytes={content[:20]!r})')
                  with open(dest, 'wb') as f:
                      f.write(content)
                  print(f'{year}: saved {len(content)/1024/1024:.2f} MB')
              except Exception as exc:
                  failures.append(f'{year}: {exc}')
              time.sleep(0.5)

          if failures:
              print('\nIMPORT FAILURES:', file=sys.stderr)
              for item in failures:
                  print(' - ' + item, file=sys.stderr)
              sys.exit(1)

      - name: Commit imported PDFs
        run: |
          git config user.name "OneShot GS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/pyq/upsc/prelims/*.pdf
          if git diff --cached --quiet; then
            echo "No new PDFs to commit"
            exit 0
          fi
          git commit -m "Host UPSC Prelims GS-I PDFs on OneShot GS"
          git push origin HEAD:main
