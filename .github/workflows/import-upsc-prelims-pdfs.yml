name: Import UPSC Prelims PDFs

on:
  push:
    paths:
      - '.github/workflows/import-upsc-prelims-pdfs.yml'

permissions:
  contents: write

jobs:
  import-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install downloader
        run: python -m pip install --quiet requests

      - name: Download UPSC GS Paper I PDFs
        shell: python
        run: |
          import os
          import sys
          import requests

          OUT = 'public/pyq/upsc/prelims'
          os.makedirs(OUT, exist_ok=True)

          SOURCES = {
              2026: 'https://r2.anantamias.com/wp-content/uploads/2026/05/UPSC-prelims-2026-gs-question-paper-set-a-english.pdf',
              2025: 'https://iasexamportal.com/sites/default/files/upsc-pre-paper-1-general-studies-2025-SET-A.pdf',
              2024: 'https://iasexamportal.com/sites/default/files/upsc-pre-paper-1-general-studies-2024-SET-A.pdf',
              2023: 'https://sanskritiias.com/uploaded_files/files/upsc-2023-gs-paer-1-final.pdf',
              2022: 'https://www.sanskritiias.com/uploaded_files/pdf/upsc-prelims-exam-paper-2022.pdf',
              2021: 'https://www.sanskritiias.com/uploaded_files/pdfs/General-Studies-Paper-I.pdf',
              2020: 'https://www.sanskritiias.com/uploaded_files/pdfs/UPSC_Pre_Paper-1B.pdf',
              2019: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2019/upsc-prelims-csp-p1-2019.pdf',
              2018: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2018/upsc-CSP-18-GS-I-2018.pdf',
              2017: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2017/CSP-17-GS_PAPER-I-2017.pdf',
              2016: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2016/GENERAL-STUDIES-PAPER-I-2016.pdf',
              2015: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2015/General-studies-I-2015.pdf',
              2014: 'https://www.sanskritiias.com/uploaded_files/exam-paper/prelims/2014/General-studies-I-2014.pdf',
          }

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          failures = []
          for year, url in SOURCES.items():
              dest = os.path.join(OUT, f'{year}.pdf')
              try:
                  print(f'{year}: downloading {url}', flush=True)
                  response = session.get(url, timeout=45, allow_redirects=True)
                  response.raise_for_status()
                  content = response.content
                  if not content.startswith(b'%PDF'):
                      raise RuntimeError(
                          f'not PDF: content-type={response.headers.get("content-type")}, '
                          f'first-bytes={content[:12]!r}'
                      )
                  if len(content) < 10000:
                      raise RuntimeError(f'PDF unexpectedly small: {len(content)} bytes')
                  with open(dest, 'wb') as handle:
                      handle.write(content)
                  print(f'{year}: saved {len(content) / 1024 / 1024:.2f} MB', flush=True)
              except Exception as exc:
                  failures.append(f'{year}: {exc}')

          if failures:
              print('\nIMPORT FAILURES:', file=sys.stderr)
              for item in failures:
                  print(' - ' + item, file=sys.stderr)
              sys.exit(1)

      - name: Commit imported PDFs
        run: |
          git config user.name "OneShot GS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/pyq/upsc/prelims/*.pdf
          if git diff --cached --quiet; then
            echo "No new PDFs to commit"
            exit 0
          fi
          git commit -m "Host UPSC Prelims GS-I PDFs on OneShot GS"
          git pull --rebase origin main
          git push origin HEAD:main
